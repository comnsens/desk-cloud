name: desk-watcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
# One active run + at most one pending (GitHub replaces an older pending run with a newer one), so the
# self-chain and the backup cron never overlap or pile up.
concurrency:
  group: desk-watcher
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check out state branch
        run: |
          mkdir -p state
          if git fetch -q origin state --depth=1; then git --work-tree=state checkout -q FETCH_HEAD -- . ; fi
          git reset -q   # do not leave state files staged in the main checkout
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests
      - name: HTTP cache (short-lived, not state)
        uses: actions/cache@v4
        with:
          path: .http-cache
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: Run watcher (~4.5 min)
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE: ${{ github.workspace }}/state
          DESK_FASTLANE: "1"
          GH_TOKEN: ${{ github.token }}   # cloud official paper BUYs -> paper-fills branch
          DESK_CYCLE_S: "20"      # 3x more cycles per run (was 60s with ~10s of work)
          DESK_DS_BATCHES: "8"    # 240 rechecks/cycle; DexScreener free limit is 300 req/min
        run: ./run_cloud.sh
      - name: Save state to the state branch (single commit, force-pushed, so history never grows)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          rm -rf .git
          git init -q -b state
          git config user.name desk-bot; git config user.email desk-bot@users.noreply.github.com
          git add -A .
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" state:state
      - name: Chain the next run (skip if STOP exists on main)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/contents/STOP?ref=main" >/dev/null 2>&1; then
            echo "STOP file on main: not chaining"; exit 0; fi
          gh workflow run desk-watcher -R "${{ github.repository }}" --ref main && echo "next run dispatched"
